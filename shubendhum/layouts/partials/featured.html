<!-- layouts/partials/featured.html -->
<section class="featured-section">
    <h2 class="featured-heading">Featured</h2>
  
    <!-- Horizontal scroller container -->
    <div class="featured-scroller">
      {{ $featuredPages := where .Site.RegularPages "Params.featured" true }}
      {{ range $featuredPages }}
      <div class="featured-post">
        <!-- Text portion -->
        <div class="featured-text">
          <h3 class="featured-title">
            <a href="{{ .Permalink }}">{{ .Title }}</a>
          </h3>
          <!-- For a short excerpt, you can use .Summary or .Description -->
          <p class="featured-description">{{ .Summary }}</p>
        </div>
  
        <!-- Image portion (only if Params.image is set) -->
        {{ with .Params.image }}
        <div class="featured-image">
          <img src="{{ . }}" alt="{{ $.Title }}">
        </div>
        {{ end }}
      </div>
      {{ end }}
    </div>
  </section>
