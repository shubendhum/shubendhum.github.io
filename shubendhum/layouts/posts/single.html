<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ .Title }}</title>
  </head>
  <body>
    <header>
      <h1>My Site Header</h1>
    </header>

    <main>
      <article>
        <h1>{{ .Title }}</h1>
        <p>Date: {{ .Date }}</p>

        {{ with .Params.image }}
          <img src="{{ . }}" alt="{{ $.Title }}">
        {{ end }}

        <!-- The main Markdown body -->
        {{ .Content }}
      </article>
    </main>

    <footer>
      <p>© 2025 My Site</p>
    </footer>
  </body>
</html>
