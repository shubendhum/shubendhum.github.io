{{ define "main" }}
  <div class="container">
    <article class="post">
      <header>
        <h1>{{ .Title }}</h1>
        <p>Published on {{ .Date.Format "Jan 2, 2006" }}</p>
      </header>

      {{ with .Params.image }}
        <figure>
          <img src="{{ . }}" alt="{{ $.Title }}">
        </figure>
      {{ end }}

      <!-- The main Markdown body -->
      <div class="post-content">
        {{ .Content }}
      </div>
    </article>
  </div>
{{ end }}
